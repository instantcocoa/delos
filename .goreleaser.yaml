# GoReleaser configuration for Delos.
#
# Two binaries, four platforms, CGO_ENABLED=0 (fully static, so the archives run
# anywhere including scratch/distroless images). Every release carries an SBOM
# per archive and a cosign-signed checksum file; see docs/getting-started/installation.md
# for the verification commands.
#
# Check this file locally with: goreleaser check
version: 2

project_name: delos

before:
  hooks:
    - go mod download

builds:
  - id: delos
    main: ./cmd/delos
    binary: delos
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  - id: delos-gateway
    main: ./cmd/delos-gateway
    binary: delos-gateway
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: delos
    ids: [delos]
    name_template: "delos_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - delos.yaml.example

  - id: delos-gateway
    ids: [delos-gateway]
    name_template: "delos-gateway_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE*
      - delos.yaml.example

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# One SBOM per archive, generated by syft (installed by the release workflow).
sboms:
  - id: archive-sboms
    artifacts: archive

# Keyless cosign signing of the checksum file: verifying the checksums verifies
# every artifact, so one signature is enough.
signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |
    ## Verifying this release

    ```bash
    cosign verify-blob checksums.txt \
      --signature checksums.txt.sig \
      --certificate checksums.txt.pem \
      --certificate-identity-regexp 'https://github.com/{{ .Env.GITHUB_REPOSITORY }}/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum -c checksums.txt --ignore-missing
    ```

    Container images: `ghcr.io/{{ .Env.GITHUB_REPOSITORY }}-delos-gateway:{{ .Version }}`
    and `ghcr.io/{{ .Env.GITHUB_REPOSITORY }}-delos:{{ .Version }}`.
