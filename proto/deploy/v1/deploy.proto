syntax = "proto3";

package delos.deploy.v1;

option go_package = "github.com/instantcocoa/delos/proto/deploy/v1;deployv1";

import "google/protobuf/timestamp.proto";

// DeployService serves quality gates. Delos does not deploy anything: it
// evaluates the most recent eval run for a prompt against a gate's conditions
// and emits a verdict. CI/CD systems act on the verdict.
service DeployService {
  // CreateQualityGate creates a quality gate. Gate names are unique.
  rpc CreateQualityGate(CreateQualityGateRequest) returns (CreateQualityGateResponse);

  // ListQualityGates lists quality gates, optionally filtered by prompt.
  rpc ListQualityGates(ListQualityGatesRequest) returns (ListQualityGatesResponse);

  // GetGateVerdict evaluates a gate against the latest completed eval run for
  // its prompt and returns pass/fail with human-readable reasons.
  rpc GetGateVerdict(GetGateVerdictRequest) returns (GetGateVerdictResponse);

  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);
}

// GateOperator is the comparison applied to a metric.
enum GateOperator {
  GATE_OPERATOR_UNSPECIFIED = 0;

  // Metric must be greater than or equal to the threshold.
  GATE_OPERATOR_GTE = 1;

  // Metric must be less than or equal to the threshold.
  GATE_OPERATOR_LTE = 2;
}

// QualityGate defines conditions an eval run must satisfy.
message QualityGate {
  string id = 1;

  // Unique, human-chosen name. This is what `delos gate check <name>` takes.
  string name = 2;

  string description = 3;

  // Prompt whose eval runs this gate reads. Slug or ID.
  string prompt_id = 4;

  repeated GateCondition conditions = 5;

  google.protobuf.Timestamp created_at = 6;
  string created_by = 7;
}

// GateCondition is a single threshold check against an eval run summary.
message GateCondition {
  // One of: overall_score, pass_rate, avg_latency_ms, total_cost_usd.
  string metric = 1;

  GateOperator operator = 2;

  double threshold = 3;
}

// CreateQualityGate
message CreateQualityGateRequest {
  string name = 1;
  string description = 2;
  string prompt_id = 3;
  repeated GateCondition conditions = 4;
}

message CreateQualityGateResponse {
  QualityGate quality_gate = 1;
}

// ListQualityGates
message ListQualityGatesRequest {
  // Optional filter. Empty returns every gate.
  string prompt_id = 1;
}

message ListQualityGatesResponse {
  repeated QualityGate quality_gates = 1;
}

// GetGateVerdict
message GetGateVerdictRequest {
  // Gate name.
  string name = 1;
}

message GetGateVerdictResponse {
  bool pass = 1;

  // Human-readable explanation, one line per condition plus context.
  repeated string reasons = 2;

  google.protobuf.Timestamp evaluated_at = 3;

  QualityGate gate = 4;

  // Eval run the verdict was computed from. Empty when no run was found.
  string eval_run_id = 5;
}

// Health
message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
}
