# Delos local stack: two binaries + Postgres.
#
#   docker compose up          -> postgres + gateway (8080) + delos control plane (8081)
#
# Optional profiles (not started by default):
#   --profile ollama           -> local LLM via Ollama (11434) + model pull
#   --profile observability    -> Jaeger UI (16686)
#   --profile test             -> LocalStack (4566)

x-env: &env-files
  env_file:
    - path: .env
      required: false
    - path: .env.local
      required: false

services:
  postgres:
    image: postgres:15-alpine
    container_name: delos-postgres
    environment:
      POSTGRES_USER: delos
      POSTGRES_PASSWORD: delos
      POSTGRES_DB: delos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Data plane: stateless LLM gateway. No database.
  gateway:
    <<: *env-files
    build:
      context: ../..
      dockerfile: Dockerfile.gateway
    container_name: delos-gateway
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Control plane: prompts, datasets, evals, deploys. Migrates itself at startup.
  delos:
    <<: *env-files
    build:
      context: ../..
      dockerfile: Dockerfile.delos
    command: ["serve"]
    container_name: delos-control-plane
    environment:
      DELOS_PORT: "8081"
      DELOS_STORAGE_BACKEND: postgres
      DELOS_DB_HOST: postgres
      DELOS_DB_PORT: "5432"
      DELOS_DB_USER: delos
      DELOS_DB_PASSWORD: delos
      DELOS_DB_NAME: delos
      DELOS_DB_SSLMODE: disable
      DELOS_GATEWAY_URL: http://gateway:8080
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- optional: local LLM (docker compose --profile ollama up) ---
  ollama:
    image: ollama/ollama:latest
    container_name: delos-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - ollama

  ollama-init:
    image: ollama/ollama:latest
    container_name: delos-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Checking for gemma3:4b model..."
        if ! OLLAMA_HOST=http://ollama:11434 ollama list | grep -q "gemma3:4b"; then
          echo "Pulling gemma3:4b model (this may take a few minutes)..."
          OLLAMA_HOST=http://ollama:11434 ollama pull gemma3:4b
        else
          echo "Model gemma3:4b already available"
        fi
        echo "Model ready!"
    restart: "no"
    profiles:
      - ollama

  # --- optional: tracing UI (docker compose --profile observability up) ---
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: delos-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    profiles:
      - observability

  # --- optional: S3 for tests (docker compose --profile test up) ---
  localstack:
    image: localstack/localstack:3.0
    container_name: delos-localstack
    environment:
      SERVICES: s3
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - test

volumes:
  postgres_data:
  localstack_data:
  ollama_data:

networks:
  default:
    name: delos-network
