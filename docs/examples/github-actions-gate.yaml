# Block a merge on a Delos quality gate.
#
# Delos does not deploy anything - it emits verdicts and CI acts on them. A
# quality gate names a prompt and a set of thresholds (e.g. overall_score>=0.8)
# that the prompt's most recent completed eval run must satisfy. `delos gate
# check <name>` evaluates the gate against that run and exits 0 (pass) or 1
# (fail), so making it a required check is all it takes to stop a regression
# from merging.
#
# Prerequisites:
#   1. A reachable Delos control plane (`delos serve`, gRPC on :8081).
#   2. A gate created once, out of band:
#        delos gate create release-gate \
#          --prompt support-assistant \
#          --condition "overall_score>=0.8" \
#          --condition "avg_latency_ms<=2000"
#   3. Eval runs recorded for that prompt - a gate over a prompt with no
#      completed run fails with an explanatory reason rather than passing.
#
# Configure the control-plane address as a repository variable
# (Settings -> Secrets and variables -> Actions):
#   vars.DELOS_CONTROL_PLANE_ADDR = delos.internal.example.com:8081
# Use a secret instead if the address itself is sensitive.
#
# Copy this file to .github/workflows/ in your repo to use it. Action versions
# are pinned to commit SHAs; the trailing comment records the tag.

name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: delos gate check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25'

      # Inside the delos repo itself this is `go install ./cmd/delos`; from any
      # other repo, install the published module.
      - name: Install the delos CLI
        run: go install github.com/instantcocoa/delos/cmd/delos@latest

      # Non-zero exit fails the job, which blocks the merge when this job is a
      # required status check. The verdict's reasons are printed above it.
      - name: Check the release gate
        env:
          DELOS_CONTROL_PLANE_ADDR: ${{ vars.DELOS_CONTROL_PLANE_ADDR }}
        run: delos gate check release-gate
